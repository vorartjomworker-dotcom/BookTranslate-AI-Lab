name: Backend Tests

on:
  push:
    branches: [ main, develop, 'feature/**' ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: test-only-secret-for-ci-at-least-32-characters-long
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 15
    strategy:
      matrix:
        python-version: ['3.12']

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: booktranslate_test
          POSTGRES_USER: booktranslate
          POSTGRES_PASSWORD: booktranslate
          POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256
        options: >-
          --health-cmd "pg_isready -U booktranslate -d booktranslate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt

    - name: Audit Python dependencies
      working-directory: backend
      run: |
        python -m pip install pip-audit==2.10.1
        pip-audit --strict -r requirements-runtime.txt
        pip-audit --strict -r requirements.txt

    - name: Compile backend
      run: python -m compileall backend/app backend/tests

    - name: Wait for PostgreSQL
      run: |
        python -c "
        import time
        import psycopg2
        for _ in range(30):
          try:
            conn = psycopg2.connect(host='localhost', user='booktranslate', password='booktranslate', dbname='booktranslate_test')
            conn.close()
            print('PostgreSQL is ready!')
            break
          except:
            time.sleep(1)
        else:
          raise TimeoutError('PostgreSQL did not become ready')
        "

    - name: Harden PostgreSQL CI logging
      run: |
        python - <<'PY'
        import psycopg2

        connect_kwargs = {
            "host": "localhost",
            "user": "booktranslate",
            "password": "booktranslate",
            "dbname": "booktranslate_test",
        }

        conn = psycopg2.connect(**connect_kwargs)
        conn.autocommit = True
        try:
            with conn.cursor() as cur:
                cur.execute("ALTER SYSTEM SET log_error_verbosity = 'terse'")
                cur.execute("ALTER SYSTEM SET log_min_error_statement = 'panic'")
                cur.execute("SELECT pg_reload_conf()")
                if not cur.fetchone()[0]:
                    raise RuntimeError("PostgreSQL configuration reload failed")
        finally:
            conn.close()

        verify = psycopg2.connect(**connect_kwargs)
        try:
            with verify.cursor() as cur:
                cur.execute("SHOW log_error_verbosity")
                if cur.fetchone()[0] != "terse":
                    raise RuntimeError("PostgreSQL log_error_verbosity hardening did not apply")
                cur.execute("SHOW log_min_error_statement")
                if cur.fetchone()[0] != "panic":
                    raise RuntimeError("PostgreSQL log_min_error_statement hardening did not apply")
        finally:
            verify.close()

        print("PostgreSQL CI logging hardened")
        PY

    - name: Start clean Redis CI service
      shell: bash
      run: |
        set -euo pipefail
        sudo sysctl -w vm.overcommit_memory=1
        cat >/tmp/booktranslate-redis-ci.conf <<'EOF'
        bind 0.0.0.0
        protected-mode no
        port 6379
        save ""
        appendonly no
        daemonize no
        loglevel notice
        EOF
        docker run --detach \
          --name booktranslate-ci-redis \
          --publish 6379:6379 \
          --volume /tmp/booktranslate-redis-ci.conf:/usr/local/etc/redis/redis.conf:ro \
          redis:7-alpine \
          redis-server /usr/local/etc/redis/redis.conf

    - name: Wait for Redis
      run: |
        python -c "
        import time
        import redis
        for _ in range(30):
          try:
            r = redis.Redis(host='localhost', port=6379)
            r.ping()
            print('Redis is ready!')
            break
          except:
            time.sleep(1)
        else:
          raise TimeoutError('Redis did not become ready')
        "

    - name: Run Alembic upgrade
      working-directory: backend
      run: alembic upgrade head
      env:
        DATABASE_URL: postgresql+asyncpg://booktranslate:booktranslate@localhost:5432/booktranslate_test

    - name: Run pytest with warnings as errors
      working-directory: backend
      run: |
        pytest tests/ -v --tb=short -W error
      env:
        DATABASE_URL: postgresql+asyncpg://booktranslate:booktranslate@localhost:5432/booktranslate_test
        REDIS_URL: redis://localhost:6379/0
        TRANSLATION_STREAM_NAME: translation_jobs
        TRANSLATION_CONSUMER_GROUP: translation-workers
        TRANSLATION_DLQ_STREAM_NAME: translation_jobs_dlq
        TRANSLATION_CONSUMER_NAME: translator-worker-1
        RUN_INTEGRATION_TESTS: "1"

    - name: Verify PostgreSQL service logs stay metadata-only and warning-clean
      if: always()
      run: |
        logs="$(docker logs "${{ job.services.postgres.id }}" 2>&1)"
        if printf '%s' "$logs" | grep -E -q 'DETAIL:|STATEMENT:|Failing row contains|\$argon2(id|i|d)\$|race-db-exact@example\.com|pg-user@example\.com'; then
          echo "::error::PostgreSQL CI service logs contain row, statement, or credential material"
          exit 1
        fi
        if printf '%s' "$logs" | grep -Fq 'role "root" does not exist'; then
          echo "::error::PostgreSQL CI healthcheck used the wrong database role"
          exit 1
        fi
        if printf '%s' "$logs" | grep -Fq 'no usable system locales were found'; then
          echo "::error::PostgreSQL CI image emitted the Alpine locale warning"
          exit 1
        fi
        if printf '%s' "$logs" | grep -Fq 'enabling "trust" authentication for local connections'; then
          echo "::error::PostgreSQL CI initdb fell back to trust authentication"
          exit 1
        fi
        echo "PostgreSQL CI service logs are metadata-only and free of healthcheck/locale/auth warning noise"

    - name: Verify Redis CI startup logs are clean
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        if ! docker inspect booktranslate-ci-redis >/dev/null 2>&1; then
          echo "::error::Redis CI container was not created"
          exit 1
        fi
        logs="$(docker logs booktranslate-ci-redis 2>&1)"
        if printf '%s' "$logs" | grep -Ei -q 'overcommit_memory|no config file specified|WARNING'; then
          echo "::error::Redis CI startup logs contain warning noise"
          printf '%s\n' "$logs"
          exit 1
        fi
        echo "Redis CI startup logs are warning-free"

    - name: Check module imports
      working-directory: backend
      run: |
        python -c "from app.main import app; print('✓ main.py OK')"
        python -c "from app.workers.translator_worker import TranslatorWorker; print('✓ translator_worker.py OK')"
        python -c "from app.models import Book, Chapter, Segment; print('✓ models.py OK')"
        python -c "from app.core.config import settings; print('✓ config.py OK')"
        python -c "from alembic.config import Config; print('✓ alembic.config OK')"

    - name: Stop Redis CI service
      if: always()
      run: docker rm --force booktranslate-ci-redis >/dev/null 2>&1 || true

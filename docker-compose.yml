services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  migrate:
    build:
      context: ./backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://booktranslate:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/booktranslate}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-15}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://booktranslate:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/booktranslate}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0}
      UPLOAD_DIR: ${UPLOAD_DIR:-/var/lib/booktranslate/uploads}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-15}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/var/lib/booktranslate/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booktranslate}
      POSTGRES_USER: ${POSTGRES_USER:-booktranslate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-booktranslate} -d ${POSTGRES_DB:-booktranslate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  translator-worker:
    build:
      context: ./backend
    command: python -m app.workers.translator_worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://booktranslate:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/booktranslate}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      DEFAULT_AI_PROVIDER: ${DEFAULT_AI_PROVIDER:-openai}
      DEFAULT_AI_MODEL: ${DEFAULT_AI_MODEL:-gpt-4o}
      TRANSLATION_STREAM_NAME: ${TRANSLATION_STREAM_NAME:-translation_jobs}
      TRANSLATION_CONSUMER_GROUP: ${TRANSLATION_CONSUMER_GROUP:-translation-workers}
      TRANSLATION_DLQ_STREAM_NAME: ${TRANSLATION_DLQ_STREAM_NAME:-translation_jobs_dlq}
      TRANSLATION_CONSUMER_NAME: ${TRANSLATION_CONSUMER_NAME:-translator-worker-1}
      UPLOAD_DIR: ${UPLOAD_DIR:-/var/lib/booktranslate/uploads}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-15}
    volumes:
      - uploads_data:/var/lib/booktranslate/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
  redis_data:
  uploads_data:
